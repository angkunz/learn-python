<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบสำหรับครูผู้สอน — PyLearn Classroom</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="img/logo-icon-192.png">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 40px;
      position: relative;
      z-index: 2;
    }
    .auth-card {
      background: var(--surface);
      border: var(--bw) solid var(--ink);
      border-radius: var(--radius-xl);
      padding: 36px;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-lg);
    }
    .auth-tabs {
      display: flex;
      gap: 10px;
      border-bottom: none;
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px 14px;
      text-align: center;
      background: var(--bg-primary);
      border: 2px solid var(--ink);
      border-radius: var(--pill);
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      font-family: inherit;
    }
    .auth-tab:hover {
      background: var(--yellow-soft);
      color: var(--ink);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .auth-tab.active {
      background: var(--yellow);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      transform: translate(-1px, -1px);
    }
    [data-theme="dark"] .auth-tab {
      background: var(--surface-2);
      color: var(--text-secondary);
    }
    [data-theme="dark"] .auth-tab.active {
      background: var(--yellow);
      color: var(--ink);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 1rem;
      font-family: inherit;
      box-shadow: 2px 2px 0 var(--ink);
      transition: var(--transition);
      box-sizing: border-box;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      transform: translate(-1px, -1px);
    }
    .btn-auth {
      width: 100%;
      padding: 13px 20px;
      background: var(--yellow);
      color: var(--ink);
      border: var(--bw) solid var(--ink);
      border-radius: var(--pill);
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: var(--transition);
      margin-top: 10px;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-auth:hover {
      background: var(--orange);
      color: #ffffff;
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-lg);
    }
    .btn-auth:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }
    .btn-auth:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: var(--shadow-sm);
    }
    .error-box {
      display: none;
      align-items: center;
      gap: 10px;
      color: #b91c1c;
      background: #fef2f2;
      border: 2px solid #ef4444;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 3px 3px 0 #ef4444;
      margin-top: 16px;
      text-align: left;
      animation: pylearnShake 0.35s ease;
    }
    [data-theme="dark"] .error-box {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
    }
    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }
    .auth-footer a {
      color: var(--primary-light);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<!-- Navbar -->
<nav class="navbar">
  <a class="nav-logo" href="index.html" title="PyLearn">
    <img src="img/logo-horizontal.png" alt="PyLearn" class="nav-logo-img">
  </a>
  <div class="nav-links">
    <a href="index.html">หน้าแรก</a>
    <a href="join.html">🏫 สำหรับนักเรียน</a>
  </div>
  <div class="nav-actions">
    <label class="theme-switch" title="สลับโหมดมืด/สว่าง">
      <input type="checkbox" class="theme-switch-cb">
      <span class="theme-switch-slider">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </span>
    </label>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <div style="text-align:center; margin-bottom: 20px;">
      <span style="font-size: 2.6rem;">👩‍🏫</span>
      <h1 style="font-size: 1.6rem; margin: 8px 0 4px; font-weight: 800;">ระบบสำหรับครูผู้สอน</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0;">สร้างห้องเรียน จัดการนักเรียน และดูบทวิเคราะห์</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">เข้าสู่ระบบ</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">สมัครบัญชีใหม่</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">อีเมล</label>
        <input type="email" id="login-email" class="form-input" placeholder="teacher@school.ac.th" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">รหัสผ่าน</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-auth" id="btn-login-submit">เข้าสู่ระบบครูผู้สอน</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="display:none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">ชื่อ - นามสกุลครูผู้สอน</label>
        <input type="text" id="reg-name" class="form-input" placeholder="อ.สมชาย ใจดี" required autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label">อีเมล</label>
        <input type="email" id="reg-email" class="form-input" placeholder="teacher@school.ac.th" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
        <input type="password" id="reg-password" class="form-input" placeholder="••••••••" minlength="6" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-auth" id="btn-reg-submit">สร้างบัญชีครูผู้สอน</button>
    </form>

    <div id="error-box" class="error-box"></div>

    <div class="auth-footer">
      <a href="index.html">← กลับหน้าหลัก</a>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  const TEACHER_TOKEN_KEY = 'pylearn_teacher_token';

  // Check if already logged in
  document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem(TEACHER_TOKEN_KEY);
    if (token) {
      try {
        const res = await fetch('/api/teacher/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          window.location.href = 'teacher-dashboard.html';
        }
      } catch {}
    }
  });

  function switchTab(tab) {
    const loginTab = document.getElementById('tab-login');
    const regTab = document.getElementById('tab-register');
    const loginForm = document.getElementById('login-form');
    const regForm = document.getElementById('register-form');
    const errBox = document.getElementById('error-box');
    errBox.style.display = 'none';

    if (tab === 'login') {
      loginTab.classList.add('active');
      regTab.classList.remove('active');
      loginForm.style.display = 'block';
      regForm.style.display = 'none';
    } else {
      regTab.classList.add('active');
      loginTab.classList.remove('active');
      regForm.style.display = 'block';
      loginForm.style.display = 'none';
    }
  }

  async function safeParseJson(res) {
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      if (window.location.protocol === 'file:') {
        throw new Error('คุณกำลังเปิดไฟล์ผ่าน file:// ทำให้ไม่สามารถเชื่อมต่อระบบหลังบ้านได้ กรุณาเปิดเว็บผ่าน http://localhost:3000');
      }
      if (window.location.port !== '3000' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        throw new Error(`คุณกำลังเปิดผ่านพอร์ต :${window.location.port || '80'} (ไม่ใช่พอร์ตของเซิร์ฟเวอร์ Node.js) กรุณาเปิดผ่าน http://localhost:3000`);
      }
      if (res.status === 404 || text.includes('The page') || text.includes('Cannot GET') || text.includes('<!DOCTYPE html>')) {
        throw new Error(`ไม่พบ API เซิร์ฟเวอร์ (${res.status} Not Found) กรุณาตรวจสอบว่ารัน 'node server.js' หรือ 'npm start' แล้วหรือยัง`);
      }
      throw new Error(`เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (${res.status}): ${text.slice(0, 100)}`);
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('btn-login-submit');
    const errBox = document.getElementById('error-box');

    errBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '⏳ กำลังเข้าสู่ระบบ...';

    try {
      const res = await fetch('/api/teacher/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await safeParseJson(res);
      if (!res.ok) throw new Error(data.error || 'เข้าสู่ระบบไม่สำเร็จ');

      localStorage.setItem(TEACHER_TOKEN_KEY, data.token);
      localStorage.setItem('pylearn_teacher_profile', JSON.stringify(data.teacher));
      showToast(`ยินดีต้อนรับ ${data.teacher.name}!`, 'success');
      setTimeout(() => {
        window.location.href = 'teacher-dashboard.html';
      }, 500);
    } catch (err) {
      errBox.textContent = '❌ ' + err.message;
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบครูผู้สอน';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const btn = document.getElementById('btn-reg-submit');
    const errBox = document.getElementById('error-box');

    errBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '⏳ กำลังสร้างบัญชี...';

    try {
      const res = await fetch('/api/teacher/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await safeParseJson(res);
      if (!res.ok) throw new Error(data.error || 'ลงทะเบียนไม่สำเร็จ');

      localStorage.setItem(TEACHER_TOKEN_KEY, data.token);
      localStorage.setItem('pylearn_teacher_profile', JSON.stringify(data.teacher));
      showToast('สร้างบัญชีสำเร็จ ยินดีต้อนรับครับ!', 'success');
      setTimeout(() => {
        window.location.href = 'teacher-dashboard.html';
      }, 500);
    } catch (err) {
      errBox.textContent = '❌ ' + err.message;
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'สร้างบัญชีครูผู้สอน';
    }
  }
</script>
</body>
</html>
