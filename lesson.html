<script>
// ============================================================
// LESSON PAGE CONTROLLER
// ============================================================

let currentLesson = null;
let currentExerciseIdx = 0;
let editors = {};  // editorId -> CM EditorView
let pyodideReady = false;
let lastRunOutput = {};  // exId -> output string

// ── Boot ──
document.addEventListener('DOMContentLoaded', () => {
  updateXPDisplay();

  const params = new URLSearchParams(location.search);
  const lessonId = params.get('id') || LESSONS_DATA[0].id;
  currentLesson = getLessonById(lessonId);
  if (!currentLesson) { location.href = 'index.html'; return; }

  renderSidebar();
  renderLesson(currentLesson);
  setupSidebarSearch();

  // Init Pyodide
  initPyodideWithUI();
});

// (No cm-ready needed — textarea editor is synchronous)

// ── Pyodide UI ──
async function initPyodideWithUI() {
  const bar = document.getElementById('py-progress-bar');
  let progress = 10;
  bar.style.width = progress + '%';
  
  // Fake progress animation while waiting for download
  const interval = setInterval(() => {
    if (progress < 90) {
      progress += (90 - progress) * 0.1; // Slow down as it gets closer to 90
      bar.style.width = progress + '%';
    }
  }, 500);

  try {
    await initPyodide();
    clearInterval(interval);
    bar.style.width = '100%';
    pyodideReady = true;
    setTimeout(() => { bar.style.opacity = '0'; }, 500);
    showToast('Python Runtime พร้อมแล้ว! 🐍', 'success');
  } catch(e) {
    clearInterval(interval);
    bar.style.background = 'var(--red)';
    showToast('โหลด Python ล้มเหลว ลองรีเฟรชหน้า', 'error');
  }
}

// ── Sidebar ──
function renderSidebar() {
  const container = document.getElementById('sidebar-content');
  const grade = getGradeLevel();
  const levels = getLevelsByGrade(grade);
  const colors = {
    elementary: '#f472b6',
    beginner: 'var(--green)',
    intermediate: 'var(--cyan)',
    advanced: 'var(--purple-light)'
  };

  container.innerHTML = levels.map(level => {
    const info = getLevelInfo(level);
    const lessons = getLessonsByLevel(level);

    return `
    <div class="sidebar-level">
      <div class="sidebar-level-header">
        <span>${info.icon}</span>
        <span style="color:${colors[level]}">${info.label}</span>
      </div>
      ${lessons.map(l => `
        <a class="sidebar-lesson ${l.id === currentLesson?.id ? 'active' : ''}"
           href="lesson.html?id=${l.id}" id="sidebar-${l.id}">
          <span class="sidebar-lesson-icon">${l.icon}</span>
          <span class="sidebar-lesson-name">${l.order}. ${l.title}</span>
          <div class="sidebar-lesson-check ${isLessonDone(l.id) ? 'done' : ''}">
            ${isLessonDone(l.id) ? '✓' : ''}
          </div>
        </a>
      `).join('')}
    </div>`;
  }).join('');
}

function setupSidebarSearch() {
  document.getElementById('sidebar-search').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    document.querySelectorAll('.sidebar-lesson').forEach(el => {
      const name = el.querySelector('.sidebar-lesson-name')?.textContent?.toLowerCase() || '';
      el.style.display = name.includes(q) ? '' : 'none';
    });
  });
}

// ── Render Lesson ──
function renderLesson(lesson) {

  const levelColors = {

    intermediate: 'var(--cyan)',

  // Breadcrumb

    <a href="index.html" style="color:var(--text-muted);text-decoration:none;font-size:0.85rem;">หน้าแรก</a>
    <span style="color:var(--text-muted);padding:0 6px;">›</span>
    <span style="color:var(--text-muted);font-size:0.85rem;">${levelInfo.label}</span>
    <span style="color:var(--text-muted);padding:0 6px;">›</span>
    <span style="color:var(--text-primary);font-size:0.85rem;font-weight:600;">${lesson.title}</span>
  `;

  // Page title
  document.title = `${lesson.title} — PyLearn`;

  const content = document.getElementById('lesson-content');
  content.innerHTML = `
    <!-- Header -->
    <div class="lesson-header">
      <div class="lesson-header-top">
        <span class="lesson-level-badge" style="background:${color}22;color:${color};">
          ${levelInfo.icon} ${levelInfo.label}
        </span>
        <span class="lesson-icon-big">${lesson.icon}</span>
      </div>
      <h1 class="lesson-title-big">${lesson.title}</h1>
      <div class="lesson-meta">
        <span>⏱️ ${lesson.duration}</span>
        <span>🎯 ${lesson.exercises.length} โจทย์</span>
        <span>${isLessonDone(lesson.id) ? '✅ ผ่านแล้ว' : '📖 กำลังเรียน'}</span>
      </div>
    </div>

    <!-- Theory -->
    <div class="section-container" style="background: rgba(13,17,23,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; margin-top: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);">
      <div class="theory-section-header" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--purple-light); margin: 0; display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 1.8rem;">📖</span> ส่วนเนื้อหาความรู้
        </h2>
        <p style="color: var(--text-secondary); margin-top: 8px; margin-bottom: 0; font-size: 0.95rem;">
          ศึกษาเนื้อหาด้านล่างและทำความเข้าใจก่อนเริ่มทำแบบฝึกหัด
        </p>
      </div>
      <div class="theory-content">${lesson.theory}</div>
    </div>

    <!-- Exercises -->
    <div class="exercise-panel section-container" id="exercise-panel" style="background: rgba(13,17,23,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; margin-top: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);">
      <!-- Rendered separately -->
    </div>

    <!-- Navigation -->
    <div class="lesson-nav-btns">
      <button class="btn-lesson-nav" id="btn-prev" onclick="goAdjacentLesson(-1)">
        ← บทก่อนหน้า
      </button>
      <button class="btn-complete" onclick="completeLesson()">
        ✅ ผ่านบทนี้แล้ว
      </button>
      <button class="btn-lesson-nav" id="btn-next" onclick="goAdjacentLesson(1)">
        บทถัดไป →
      </button>
    </div>
  `;

  // Render exercises (waits for CodeMirror)
  renderExercises(lesson);
  updateNavButtons();
}

// ── Render Exercises ──
function renderExercises(lesson) {
  const panel = document.getElementById('exercise-panel');
  if (!panel) return;

  panel.innerHTML = `
    <div class="exercise-section-header" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--cyan); margin: 0; display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 1.8rem;">🎯</span> ส่วนแบบฝึกหัด (${lesson.exercises.length} ข้อ)
      </h2>
      <p style="color: var(--text-secondary); margin-top: 8px; margin-bottom: 0; font-size: 0.95rem;">
        นำความรู้มาประยุกต์ใช้ แต่ละข้อสามารถรันโค้ดและใช้ AI ช่วยตรวจแยกกันได้เลย
      </p>
    </div>
    <div id="exercise-list" style="display:flex;flex-direction:column;gap:40px;">
      ${lesson.exercises.map(ex => `<div id="wrapper-${ex.id}"></div>`).join('')}
    </div>
  `;

  // Render all exercise cards
  lesson.exercises.forEach((ex, idx) => {
    renderExerciseCard(lesson, idx, `wrapper-${ex.id}`);
  });
}

// (Tab switching removed)

function renderExerciseCard(lesson, idx, containerId) {
  const ex = lesson.exercises[idx];
  const container = document.getElementById(containerId);
  const editorId = `editor-${lesson.id}-${ex.id}`;
  const savedCode = localStorage.getItem(`code-${lesson.id}-${ex.id}`) || ex.starterCode;

  container.innerHTML = `
    <div class="exercise-card" id="ex-card-${ex.id}" style="border:1px solid rgba(124,58,237,0.2); border-radius:16px; padding:24px; background:rgba(13,17,23,0.7); box-shadow:0 8px 24px rgba(0,0,0,0.2);">
      <div class="exercise-desc">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:12px;">
          <h3 style="margin:0; font-size:1.25rem; color:var(--text-primary);">ข้อ ${idx + 1}. ${ex.title}</h3>
          <span class="difficulty-badge difficulty-${ex.difficulty}">${
            ex.difficulty === 'easy' ? '🟢 ง่าย' : ex.difficulty === 'medium' ? '🟡 ปานกลาง' : '🔴 ยาก'
          }</span>
          ${isExerciseDone(lesson.id, ex.id) ? '<span style="color:var(--green);font-size:0.85rem;font-weight:700;">✅ ทำแล้ว</span>' : ''}
        </div>
        <p>${ex.description}</p>
      </div>

      <!-- Editor Toolbar -->
      <div class="editor-toolbar">
        <div class="editor-lang">🐍 Python 3</div>
        <div class="editor-actions">
          <button class="btn-reset" onclick="resetCode('${lesson.id}','${ex.id}','${editorId}')" title="รีเซ็ต">↺</button>
          <button class="btn-hint" onclick="showHint('${ex.id}')" id="hint-btn-${ex.id}">💡 Hint</button>
          <button class="btn-run" onclick="runCode('${lesson.id}','${ex.id}','${editorId}')" id="run-btn-${ex.id}">
            ▶ Run
          </button>
        </div>
      </div>

      <!-- Editor -->
      <div class="textarea-holder" id="${editorId}"></div>

      <!-- Output -->
      <div class="output-panel">
        <div class="output-header">
          <div class="output-label">📤 Output</div>
          <div class="output-status" id="status-${ex.id}"></div>
        </div>
        <div class="output-content output-placeholder" id="output-${ex.id}">
          กด ▶ Run เพื่อรันโค้ด
        </div>
      </div>
    </div>

    <!-- AI Panel -->
    <div class="ai-panel" style="margin-top:16px;" id="ai-panel-${ex.id}">
      <div class="ai-panel-header">
        <div class="ai-panel-title">
          <div class="ai-icon" id="ai-panel-icon-${ex.id}">🤖</div>
          <span id="ai-panel-label-${ex.id}">AI ตรวจโค้ด &amp; ให้คะแนน</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <!-- Mode Toggle -->
          <div class="check-mode-toggle" id="mode-toggle-${ex.id}" title="เลือกโหมดตรวจโค้ด">
            <button class="mode-btn mode-btn-ai" id="mode-ai-${ex.id}"
              onclick="setExerciseMode('${ex.id}', 'ai')">
              🤖 AI
            </button>
            <button class="mode-btn mode-btn-auto active" id="mode-auto-${ex.id}"
              onclick="setExerciseMode('${ex.id}', 'auto')">
              ⚡ Auto
            </button>
          </div>
          <button class="btn-ai-check" id="ai-btn-${ex.id}"
            onclick="runAICheck('${lesson.id}','${ex.id}','${editorId}')">
            🔍 ตรวจโค้ด
          </button>
        </div>
      </div>
      <div class="ai-content">
        <div class="ai-placeholder" id="ai-result-${ex.id}">
          <span id="ai-placeholder-text-${ex.id}">รันโค้ดแล้วกด &ldquo;ตรวจโค้ด&rdquo; เพื่อให้ AI วิเคราะห์และให้คะแนน</span>
        </div>
      </div>
    </div>
  `;

  // Mount textarea editor
  const wrap = document.getElementById(editorId);
  if (wrap) {
    if (editors[editorId]) editors[editorId].destroy();
    editors[editorId] = createEditor(wrap, savedCode);
  }

  // Sync toggle state with stored preference
  const savedMode = getCheckMode();
  setExerciseMode(ex.id, savedMode);
}

// ── Run Code ──
async function runCode(lessonId, exId, editorId) {
  if (!pyodideReady) {
    showToast('Python กำลังโหลด... รอสักครู่', 'warning');
    return;
  }

  const editor = editors[editorId];
  if (!editor) return;
  const code = getEditorCode(editor);

  // Save code
  localStorage.setItem(`code-${lessonId}-${exId}`, code);

  const runBtn = document.getElementById(`run-btn-${exId}`);
  const outputEl = document.getElementById(`output-${exId}`);
  const statusEl = document.getElementById(`status-${exId}`);

  runBtn.disabled = true;
  runBtn.innerHTML = '<div class="spinner" style="width:14px;height:14px;margin:0"></div> กำลังรัน...';
  outputEl.className = 'output-content';
  outputEl.innerHTML = '<div class="output-loading"><div class="spinner"></div> กำลังรัน Python...</div>';
  statusEl.textContent = '';
  statusEl.className = 'output-status running';
  statusEl.textContent = '⏳ Running...';

  try {
    const result = await runPython(
      code,
      (partialOutput) => {
        outputEl.className = 'output-content';
        outputEl.textContent = partialOutput || '(รอพิมพ์...)';
      },
      createInputDialog  // Input handler
    );

    lastRunOutput[exId] = result.output;

    if (result.success) {
      outputEl.className = 'output-content success';
      outputEl.textContent = result.output || '(ไม่มี output)';
      statusEl.className = 'output-status success';
      statusEl.textContent = '✅ สำเร็จ';
      // Auto-mark exercise done on successful run
      if (markExerciseDone(lessonId, exId)) {
        showToast(`+20 XP ทำโจทย์ "${currentLesson.exercises.find(e=>e.id===exId)?.title}" สำเร็จ!`, 'success');
        // Update badge UI
        const exTitle = document.querySelector(`#ex-card-${exId} h3`);
        if (exTitle && !exTitle.innerHTML.includes('✅')) {
           const badge = document.createElement('span');
           badge.style.cssText = 'color:var(--green);font-size:0.85rem;font-weight:700;margin-left:8px;';
           badge.textContent = '✅ ทำแล้ว';
           exTitle.parentNode.appendChild(badge);
        }
        renderSidebar();
      }
    } else {
      outputEl.className = 'output-content error';
      outputEl.textContent = result.output;
      statusEl.className = 'output-status error';
      statusEl.textContent = '❌ Error';
    }
  } catch(e) {
    outputEl.className = 'output-content error';
    outputEl.textContent = e.message;
    statusEl.className = 'output-status error';
    statusEl.textContent = '❌ Error';
  }

  runBtn.disabled = false;
  runBtn.innerHTML = '▶ Run';
}

// ── Set Exercise Check Mode ──
function setExerciseMode(exId, mode) {
  setCheckMode(mode);
  const aiBtn  = document.getElementById(`mode-ai-${exId}`);
  const autoBtn = document.getElementById(`mode-auto-${exId}`);
  const iconEl  = document.getElementById(`ai-panel-icon-${exId}`);
  const labelEl = document.getElementById(`ai-panel-label-${exId}`);
  const phEl    = document.getElementById(`ai-placeholder-text-${exId}`);

  if (mode === 'auto') {
    aiBtn?.classList.remove('active');
    autoBtn?.classList.add('active');
    if (iconEl) iconEl.textContent = '⚡';
    if (labelEl) labelEl.textContent = 'Auto ตรวจโค้ด (ไม่ใช้ AI)';
    if (phEl) phEl.textContent = 'รันโค้ดแล้วกด “ตรวจโค้ด” เพื่อเช็คคะแนนแบบอัตโนมัติ (ไม่ต้องมี API Key)';
  } else {
    autoBtn?.classList.remove('active');
    aiBtn?.classList.add('active');
    if (iconEl) iconEl.textContent = '🤖';
    if (labelEl) labelEl.textContent = 'AI ตรวจโค้ด & ให้คะแนน';
    if (phEl) phEl.textContent = 'รันโค้ดแล้วกด “ตรวจโค้ด” เพื่อให้ AI วิเคราะห์และให้คะแนน';
  }
}

// ── AI Check (with Rate Limiting) ──
let _lastAICheckTime = 0;
const AI_CHECK_COOLDOWN = 5000; // 5 seconds

async function runAICheck(lessonId, exId, editorId) {
  // Rate limiting
  const now = Date.now();
  if (now - _lastAICheckTime < AI_CHECK_COOLDOWN) {
    const remaining = Math.ceil((AI_CHECK_COOLDOWN - (now - _lastAICheckTime)) / 1000);
    showToast(`กรุณารอ ${remaining} วินาทีก่อนตรวจอีกครั้ง`, 'warning');
    return;
  }
  _lastAICheckTime = now;

  const editor = editors[editorId];
  if (!editor) return;
  const code = getEditorCode(editor);
  const exercise = currentLesson.exercises.find(e => e.id === exId);
  const aiResult = document.getElementById(`ai-result-${exId}`);
  const aiBtn = document.getElementById(`ai-btn-${exId}`);
  const mode = getCheckMode(); // 'ai' or 'auto'

  aiBtn.disabled = true;
  aiResult.innerHTML = `
    <div class="ai-loading">
      <div class="ai-typing"><span></span><span></span><span></span></div>
      <span>${mode === 'auto' ? '⚡ กำลังตรวจโค้ดแบบอัตโนมัติ...' : 'AI กำลังวิเคราะห์โค้ดอย่างละเอียด...'}</span>
    </div>`;

  try {
    let fb;
    if (mode === 'auto') {
      // Auto mode: instant, no API key needed
      await new Promise(r => setTimeout(r, 400));
      fb = getAutoFeedback(
        exercise.description,
        code,
        lastRunOutput[exId] || '',
        exercise.solution || '',
        exercise.hint || '',
        exercise.starterCode || '',
        exercise.difficulty || 'easy',
        exercise.expectedOutput || ''
      );
    } else {
      // AI mode: call Gemini
      fb = await getAIFeedback(
        currentLesson.title,
        exercise.title,
        exercise.description,
        code,
        lastRunOutput[exId] || '',
        exercise.solution || '',
        exercise.hint || '',
        exercise.starterCode || '',
        exercise.difficulty || 'easy',
        exercise.expectedOutput || ''
      );
    }

    // Use the new detailed renderer
    renderAIResult(`ai-result-${exId}`, fb);

    if (fb.score >= 80) celebrate();

  } catch(e) {
    aiResult.innerHTML = `
      <div style="color:var(--red);font-size:0.875rem;padding:8px;">
        ❌ ${e.message}
        <br><button onclick="showApiKeyModal(()=>runAICheck('${lessonId}','${exId}','${editorId}'))"
          style="margin-top:8px;padding:6px 14px;border-radius:8px;border:1px solid var(--purple);
          background:var(--purple-dim);color:var(--purple-light);cursor:pointer;font-size:0.8rem;">
          🔑 ตั้งค่า API Key
        </button>
      </div>`;
  }

  aiBtn.disabled = false;
}


// ── Show Hint ──
function showHint(exId) {
  const ex = currentLesson.exercises.find(e => e.id === exId);
  if (!ex) return;

  const existing = document.querySelector('.hint-toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'hint-toast';
  toast.innerHTML = `
    <div class="hint-toast-title">💡 คำใบ้</div>
    <div class="hint-toast-text">${escapeHtml(ex.hint)}</div>
    <button onclick="this.parentElement.remove()" style="
      margin-top:10px;padding:4px 12px;border-radius:6px;border:1px solid var(--orange);
      background:transparent;color:var(--orange);cursor:pointer;font-size:0.8rem;
    ">ปิด</button>
  `;
  document.body.appendChild(toast);
  setTimeout(() => toast?.remove(), 8000);
}

// ── Reset Code ──
function resetCode(lessonId, exId, editorId) {
  const ex = currentLesson.exercises.find(e => e.id === exId);
  if (!ex) return;
  const editor = editors[editorId];
  if (!editor) return;
  setEditorCode(editor, ex.starterCode);
  localStorage.removeItem(`code-${lessonId}-${exId}`);
  showToast('รีเซ็ตโค้ดแล้ว', 'info');
}

// ── Complete Lesson ──
function completeLesson() {
  const isNew = markLessonDone(currentLesson.id);
  if (isNew) {
    celebrate();
    showToast(`🏆 +50 XP ผ่านบท "${currentLesson.title}" แล้ว!`, 'success', 4000);
    renderSidebar();
    document.getElementById('stat-xp') && (document.getElementById('stat-xp').textContent = getXP());
  } else {
    showToast('คุณผ่านบทนี้ไปแล้ว!', 'info');
  }
  // Auto advance
  setTimeout(() => goAdjacentLesson(1), 1500);
}

// ── Navigate Lessons ──
function goAdjacentLesson(direction) {
  const grade = getGradeLevel();
  const visibleLevels = getLevelsByGrade(grade);
  const allLessons = LESSONS_DATA
    .filter(l => visibleLevels.includes(l.level))
    .slice()
    .sort((a,b) => {
      const lo = { elementary: 0, beginner: 1, intermediate: 2, advanced: 3 };
      return lo[a.level] - lo[b.level] || a.order - b.order;
    });
  const idx = allLessons.findIndex(l => l.id === currentLesson.id);
  const next = allLessons[idx + direction];
  if (next) {
    location.href = `lesson.html?id=${next.id}`;
  } else if (direction > 0) {
    showToast('🎉 คุณเรียนจบทุกบทแล้ว!', 'success');
    setTimeout(() => { location.href = 'index.html'; }, 2000);
  }
}

function updateNavButtons() {
  const grade = getGradeLevel();
  const visibleLevels = getLevelsByGrade(grade);
  const allLessons = LESSONS_DATA
    .filter(l => visibleLevels.includes(l.level))
    .slice()
    .sort((a,b) => {
      const lo = { elementary: 0, beginner: 1, intermediate: 2, advanced: 3 };
      return lo[a.level] - lo[b.level] || a.order - b.order;
    });
  const idx = allLessons.findIndex(l => l.id === currentLesson.id);
  const prevBtn = document.getElementById('btn-prev');
  const nextBtn = document.getElementById('btn-next');
  if (prevBtn) prevBtn.disabled = idx <= 0;
  if (nextBtn) nextBtn.disabled = idx === -1 || idx === allLessons.length - 1;
}

// Expose globals
window.runCode = runCode;
window.runAICheck = runAICheck;
window.setExerciseMode = setExerciseMode;
window.showHint = showHint;
window.resetCode = resetCode;
window.completeLesson = completeLesson;
window.goAdjacentLesson = goAdjacentLesson;
</script>
